name: CI/CD Pipeline & Demo Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Test & Verify Demo
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3
        coverage: none

    - name: Copy .env
      run: cp .env.example .env

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate Application Key
      run: php artisan key:generate

    - name: Setup SQLite Database
      run: |
        mkdir -p database
        touch database/database.sqlite
        php artisan migrate --force --database=sqlite

    - name: Run Tests
      run: php artisan test

    - name: Deploy Demo Verification
      if: github.ref == 'refs/heads/main'
      run: |
        echo "=== Pipeline Deploy Demo Kawan Pangan ==="
        echo "Status: Berhasil diverifikasi dan siap live."
        echo "PBI: PBI-01 Setup repositori, struktur proyek, dan deploy demo."
        echo "Commit: ${{ github.sha }}"
